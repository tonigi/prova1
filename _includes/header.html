{% assign current_url = page.url | default: "/" %}
<header class="site-header">
  <div class="content-wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="{% if current_url == '/' or current_url == '/index.html' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="{% if current_url contains 'the-group' %}active{% endif %}" href="{{ '/the-group.html' | relative_url }}">The group</a>
      <a class="{% if current_url contains 'research' %}active{% endif %}" href="{{ '/research.html' | relative_url }}">Research</a>
      <a class="{% if current_url contains 'publications' %}active{% endif %}" href="{{ '/publications.html' | relative_url }}">Publications</a>
      <a class="{% if current_url contains 'for-students' %}active{% endif %}" href="{{ '/for-students.html' | relative_url }}">Available theses</a>
    </nav>
  </div>
</header>
